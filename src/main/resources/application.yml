server:
  port: 9001

spring:
  application:
    name: mcp-domain

logging:
  level:
    com.floworchestrator.mcpdomain: DEBUG
    com.floworchestrator.mcpdomain.tools: INFO
  pattern:
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%-5level){level} %clr([%thread]){faint} %clr(%logger{36}){cyan} - %clr(%msg){level}%n%ex"

services:
  control-center:
    base-url: ${CONTROL_CENTER_BASE_URL:http://localhost:8081}
  orchestrator:
    base-url: ${ORCHESTRATOR_BASE_URL:http://localhost:8080}
  auto-database:
    base-url: ${AUTO_DATABASE_URL:http://localhost:8083}

auto:
  database:
    url: ${AUTO_DATABASE_URL:http://localhost:8083}
